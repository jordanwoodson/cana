syntax = "proto3";
option java_package = "io.github.samolego.canta.data.proto";
option java_multiple_files = true;

message NetworkBlock {
  string package_name = 1;
  int32 user_id = 2;
  int32 app_id = 3;
}
message PrivacyDesiredState {
  repeated NetworkBlock network_blocks = 1;
  repeated NetworkBlock metered_blocks = 2;
}
