syntax = "proto3";

option java_package = "io.github.samolego.canta.data.proto";
option java_multiple_files = true;

message OperationRecord {
  string id = 1;
  string batch_id = 2;
  int64 timestamp_ms = 3;
  int32 user_id = 4;
  string package_name = 5;
  string action = 6;
  string previous_state = 7;
  bool completed = 8;
  bool success = 9;
  string result_message = 10;
  string after_state = 11;
  bool changed = 12;
  string undo_of = 13;
}

message OperationHistory {
  repeated OperationRecord records = 1;
}
