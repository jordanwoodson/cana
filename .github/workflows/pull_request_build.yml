name: Android checks

on:
  pull_request:
    branches: [master, roadmap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validateAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Unit tests, lint, and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/
          retention-days: 7

  emulatorUi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated UI and storage regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.samolego.canta.ui.CategoryFilterDeviceTest,io.github.samolego.canta.ui.AppListLoadingDeviceTest,io.github.samolego.canta.ui.PresetImportUiDeviceTest,io.github.samolego.canta.ui.SelectionUxDeviceTest,io.github.samolego.canta.ui.PrivacyDisconnectedUiTest,io.github.samolego.canta.ops.BatchLifecycleDeviceTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-ui-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
