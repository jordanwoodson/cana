name: 📦🚀 Build and publish Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "3.2.2-cana.*"

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  deployAndroid:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: 🤖📦🚀 Build & prepare Android release
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "21.x"
          cache: "gradle"
          distribution: "adopt"

      - name: 🔐 Retrieve base64 keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "android-keystore.jks"
          fileDir: "${{ github.workspace }}/"
          encodedString: ${{ secrets.KEYSTORE_FILE_BASE64 }}

      - name: 📝🔐 Create keystore.properties file
        env:
          KEYSTORE_PROPERTIES_PATH: ${{ github.workspace }}/key.properties
          KEYSTORE_FILE: ${{ github.workspace }}/android-keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: python3 scripts/write-signing-properties.py

      - name: 📌 Extract version_name from gradle.properties
        id: extract_version
        run: |
          # read version_name
          version=$(grep "^version_name=" app/gradle.properties | cut -d'=' -f2)
          echo "VERSION_NAME=$version" >> $GITHUB_ENV

      - name: Check release tag matches the APK version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "$VERSION_NAME"

      - name: 🤖📦 Build Android APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease

      - name: Name the signed APK for Obtainium
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/cana-v$VERSION_NAME.apk"

      - name: 📝 Generate SHA-256 checksums
        run: |
          cd app/build/outputs/apk/release/
          sha256sum *.apk > SHA256SUMS.txt

      - name: "Echo SHA-256 sums"
        run: cat app/build/outputs/apk/release/SHA256SUMS.txt

      - name: 🔧 Setup GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh config set prompt disabled

      - name: 🛡️ Generate artifact attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'app/build/outputs/apk/release/*.apk'

      - name: 📦 Publish tagged GitHub release with its assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION_NAME" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/SHA256SUMS.txt \
            "${{ steps.attest.outputs.bundle-path }}" \
            --verify-tag --latest \
            --title "Cana $VERSION_NAME" \
            --notes-file "docs/releases/$VERSION_NAME.md"

      - name: 📦 Prepare manual GitHub release draft with its assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION_NAME" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/SHA256SUMS.txt \
            "${{ steps.attest.outputs.bundle-path }}" \
            --draft --target "$GITHUB_SHA" \
            --title "Cana $VERSION_NAME" \
            --notes-file "docs/releases/$VERSION_NAME.md"
