name: 📦🚀 Release

# Every push to master that changes the app publishes a signed APK as a new
# GitHub release, which Obtainium picks up as an update. Versions are assigned
# here: don't bump version_name/version_code or push tags by hand.
on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

# Queue releases so two pushes can't claim the same version number
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Cana release certificate; Android refuses updates signed with any other key
  CERT_SHA256: 748e751a9dd9240f9e8cc7cd7f7218dd1541e6abaa09603d282284062639e345

jobs:
  profile-checks:
    uses: ./.github/workflows/profile-regressions.yml
    permissions:
      contents: read

  release:
    needs: profile-checks
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the version number and notes

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 📌 Assign the next version
        run: |
          n=$(git tag --list '*-cana.*' | sed 's/.*-cana\.//' | sort -n | tail -1)
          last_tag=$(git tag --list "*-cana.$n")
          n=$((n + 1))
          base=$(sed -n 's/^version_name=\(.*\)-cana\..*/\1/p' app/gradle.properties)
          test -n "$base"
          version="$base-cana.$n"
          code=$((224 + n)) # cana.1 was version code 225
          sed -i "s/^version_name=.*/version_name=$version/; s/^version_code=.*/version_code=$code/" app/gradle.properties
          echo "LAST_TAG=$last_tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version (version code $code) after $last_tag"

      - name: 🔐 Set up release signing
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/cana-release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_FILE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          python3 scripts/write-signing-properties.py

      - name: 🤖📦 Test and build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: 🔏 Check the signature and name the APK
        working-directory: app/build/outputs/apk/release
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app-release.apk | grep -qi "SHA-256 digest: $CERT_SHA256" \
            || { echo "::error::APK is not signed with the Cana release key"; exit 1; }
          mv app-release.apk "cana-v$VERSION.apk"
          sha256sum "cana-v$VERSION.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 🚀 Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git log --no-merges --format='- %s' "$LAST_TAG"..HEAD
            echo
            echo "Built from $GITHUB_SHA."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" \
            "app/build/outputs/apk/release/cana-v$VERSION.apk" \
            app/build/outputs/apk/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest \
            --title "Cana $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
